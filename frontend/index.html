<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage Tool</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --border: #e5e5e8; --text: #1c1c1e;
    --muted: #6b6b70; --accent: #2f5df5; --accent-hover: #234bd1;
    --danger: #d92d20; --warn-bg: #fff4e0; --warn-text: #8a5a00; --warn-border: #f0c674;
    --pill-high-bg: #fde8e8; --pill-high-text: #c0362c;
    --pill-medium-bg: #fff4e0; --pill-medium-text: #a15c00;
    --pill-low-bg: #e8f5e9; --pill-low-text: #1c7c3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header {
    padding: 18px 32px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  nav button {
    border: 1px solid transparent; background: none; padding: 8px 16px; margin-left: 4px;
    cursor: pointer; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--muted);
    transition: all 0.15s;
  }
  nav button:hover { background: var(--bg); }
  nav button.active { background: var(--accent); color: #fff; }
  main { max-width: 760px; margin: 32px auto; padding: 0 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .card h3 { font-size: 15px; margin: 0 0 14px; font-weight: 600; color: var(--text); }
  label { font-size: 13px; color: var(--muted); display: block; margin: 14px 0 5px; font-weight: 500; }
  textarea, input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: var(--panel); color: var(--text);
  }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 10px 20px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; margin-top: 16px;
    transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  .back { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0; margin-bottom: 14px; font-weight: 500; }
  .queue-row {
    display: flex; justify-content: space-between; align-items: center; padding: 13px 0;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s;
  }
  .queue-row:last-child { border-bottom: none; }
  .queue-row:hover { background: #fafafa; margin: 0 -22px; padding: 13px 22px; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .pill-high { background: var(--pill-high-bg); color: var(--pill-high-text); }
  .pill-medium { background: var(--pill-medium-bg); color: var(--pill-medium-text); }
  .pill-low { background: var(--pill-low-bg); color: var(--pill-low-text); }
  .status-badge { font-weight: 600; font-size: 13px; }
  .dup-tag { color: var(--warn-text); font-size: 12px; font-weight: 600; margin-left: 8px; }
  .dup-banner {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .token-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .token-row input { flex: 1; }
  .token-row button {
    padding: 10px 14px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  ul { margin: 6px 0; padding-left: 20px; }
  li { margin: 4px 0; font-size: 14px; }
  #audit div { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
  #audit div:last-child { border-bottom: none; }
  a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Request Intake &amp; Triage</h1>
  <nav>
    <button id="nav-submit" class="active">Submit</button>
    <button id="nav-queue">Queue</button>
  </nav>
</header>
<main id="app"></main>
<script type="module" src="./dist/app.js"></script>
</body>
</html>
